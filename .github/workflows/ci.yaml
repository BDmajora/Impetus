# Used when a commit is pushed to the repository
# Runs the test suite (with the coverage gate) and builds the release jar
name: ci
on: push

jobs:
  build:
    runs-on: ubuntu-large

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.4
      - name: Initialize Unimined caches
        uses: actions/cache@v4
        with:
          path: |
            **/.gradle/unimined
          key: unimined-v5-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            unimined-v5-${{ runner.os }}-
      - name: Test
        run: ./gradlew test jacocoTestCoverageVerification :common:check --continue --stacktrace
      - name: Build the release jar
        run: ./gradlew packageJar --stacktrace
      - name: Show checksums
        run: find build/libs -name \*.jar | sort | xargs sha256sum
