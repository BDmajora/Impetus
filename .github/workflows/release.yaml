# Manually triggered release build
name: build-release

on:
  workflow_dispatch:
    inputs:
      publish_engine:
        type: boolean
        description: Also publish the engine module (impetus-engine) to Maven
        default: false

env:
  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
  MAVEN_SECRET: ${{ secrets.MAVEN_SECRET }}

jobs:
  build:
    runs-on: ubuntu-large

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.4
      - name: Initialize Unimined caches
        uses: actions/cache@v4
        with:
          path: |
            **/.gradle/unimined
          key: unimined-v5-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            unimined-v5-${{ runner.os }}-
      - name: Build the release jar and the legacy engine jar
        run: ./gradlew packageJar :common:legacyJar --stacktrace
      - name: Publish the engine module
        if: ${{ inputs.publish_engine }}
        run: ./gradlew :common:publish --stacktrace
      - name: Show checksums
        run: find build/libs common/build/libs -name \*.jar | sort | xargs sha256sum
