plugins {
    id 'impetus-lwjgl-abstraction'
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'xyz.wagyourtail.jvmdowngrader' version '1.3.6'
}

group = "com.bdmajora.impetus"
version = rootProject.version

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories {
    mavenCentral()
}

def generatedSourcesDir = layout.buildDirectory.dir("generated/sources/lwjgl-abstraction/java")

sourceSets {
    lwjglCommon {
        java.srcDir(generatedSourcesDir.map { it.dir("main") })
    }
    lwjgl2 {
        java.srcDir(generatedSourcesDir.map { it.dir("lwjgl2") })
        compileClasspath += main.compileClasspath
        compileClasspath += lwjglCommon.output
    }
    lwjgl3 {
        java.srcDir(generatedSourcesDir.map { it.dir("lwjgl3") })
        compileClasspath += main.compileClasspath
        compileClasspath += lwjglCommon.output
    }
    main {
        compileClasspath += lwjglCommon.output
    }
    // The test backend and LWJGL2 stand-ins are shared with the root project's tests through src/testShared
    test {
        java.srcDir('src/testShared/java')
        resources.srcDir('src/testShared/resources')
        compileClasspath += lwjglCommon.output + lwjgl2.output + configurations.lwjgl2CompileClasspath
        runtimeClasspath += lwjglCommon.output + lwjgl2.output
    }
}

// LWJGL2's manifest seals org.lwjgl.opengl, which would reject the Display and GLContext stand-ins; tests load an unsealed copy instead
def unsealLwjgl = tasks.register('unsealLwjgl', Jar) {
    archiveFileName = 'lwjgl2-unsealed.jar'
    destinationDirectory = layout.buildDirectory.dir('unsealed')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.lwjgl2CompileClasspath.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}
sourceSets.test.runtimeClasspath += files(unsealLwjgl)

def generateAbstractionLayer = tasks.named("generateLWJGLAbstraction") {
    lwjgl2Classpath.from(configurations.named("lwjgl2CompileClasspath"))
    lwjgl3Classpath.from(configurations.named("lwjgl3CompileClasspath"))
    outputDirectory.set(generatedSourcesDir)
}

tasks.named("compileLwjglCommonJava") {
    dependsOn(generateAbstractionLayer)
}

dependencies {
    def lwjglVersion = "3.3.1"
    def lwjgl2Version = "2.9.3"

    lwjgl3CompileOnly(platform("org.lwjgl:lwjgl-bom:$lwjglVersion"))
    lwjgl3CompileOnly "org.lwjgl:lwjgl"
    lwjgl3CompileOnly "org.lwjgl:lwjgl-opengl"

    lwjgl2CompileOnly("org.lwjgl.lwjgl:lwjgl:$lwjgl2Version")

    implementation "org.joml:joml:1.10.5"
    implementation "it.unimi.dsi:fastutil:7.1.0"
    implementation "org.apache.logging.log4j:log4j-api:2.0-beta9"
    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly("org.projectlombok:lombok:1.18.30")
    annotationProcessor("org.projectlombok:lombok:1.18.30")
    implementation("org.ow2.asm:asm:9.6")
    implementation("org.ow2.asm:asm-tree:9.6")
    implementation("org.ow2.asm:asm-util:9.6")

    implementation "com.google.code.gson:gson:2.10.1"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.0'
    testImplementation 'org.mockito:mockito-core:5.17.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // run.sh test reports failures itself, and the coverage report must still be produced when tests fail
    ignoreFailures = true

    maxHeapSize = '1G'
    // Config code writes relative "config/" paths, so tests run from a scratch directory under build
    workingDir = layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs() }
    // Mockito's inline mock maker self-attaches a ByteBuddy agent, which JDK 21 warns about unless allowed up front
    jvmArgs "-XX:+EnableDynamicAgentLoading", "--add-opens", "java.base/java.nio=ALL-UNNAMED", "--add-opens", "java.base/java.lang=ALL-UNNAMED"
    systemProperty "impetus.lwjgl.service", "com.bdmajora.testing.TestGl"
    // Compatibility warnings pop Swing dialogs; keep the run headless and silent
    systemProperty "java.awt.headless", "true"
    systemProperty "impetus.hideMessageBoxes", "true"

    testLogging {
        events "failed"
        exceptionFormat "full"
    }
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = "0.8.13"
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    sourceSets sourceSets.main, sourceSets.lwjglCommon, sourceSets.lwjgl2
    reports {
        xml.required = true
        html.required = true
    }
}

// run.sh test reads the XML; this task is the gate for CI-style runs
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('test')
    sourceSets sourceSets.main, sourceSets.lwjglCommon, sourceSets.lwjgl2
    violationRules {
        rule {
            limit { counter = 'METHOD'; value = 'COVEREDRATIO'; minimum = 1.0 }
            limit { counter = 'CLASS'; value = 'COVEREDRATIO'; minimum = 1.0 }
        }
    }
}

// LWJGL is compileOnly on the lwjgl2/lwjgl3 source sets, so jvmdowngrader cannot resolve types like
// org.lwjgl.PointerBuffer or org.lwjgl.opengl.GLSync while rewriting frames, and logs an ERROR per
// class per downgrade pass. Handing it the same classpath the source sets compile against silences
// that and lets it compute exact frames instead of falling back to a supertype.
tasks.named('downgradeJar') {
    classpath = classpath + files(
            configurations.lwjgl2CompileClasspath,
            configurations.lwjgl3CompileClasspath
    )
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'impetus-common'
            from components.java

            artifact(shadeDowngradedApi) {
                classifier = 'downgraded-8'
            }
        }
    }
    repositories {
        maven {
            name = "taumcRepository"
            url = uri("https://maven.taumc.org/releases")
            credentials {
                username = System.getenv("MAVEN_USERNAME")
                password = System.getenv("MAVEN_SECRET")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

jar {
    from(rootProject.file("LICENSE"))
    from(sourceSets.lwjglCommon.output)
    from(sourceSets.lwjgl2.output)
    from(sourceSets.lwjgl3.output)
    manifest {
        attributes([
                "Lwjgl3ify-Aware": "true"
        ])
    }
}

def extraSourceSets = [sourceSets.lwjglCommon, sourceSets.lwjgl2]

configurations {
    apiElements
    runtimeElements
}

extraSourceSets.each { srcSet ->
    ["apiElements", "runtimeElements"].each { conf ->
        configurations.getByName(conf).outgoing.variants.named("classes") {
            artifact(srcSet.java.destinationDirectory) {
                builtBy tasks.named(srcSet.compileJavaTaskName)
            }
        }
    }
}

configurations {
    downgraded {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    downgraded(tasks.named("shadeDowngradedApi"))
}

// make RFG stop complaining
def obfAttr = Attribute.of("com.gtnewhorizons.retrofuturagradle.obfuscation", String)
def transformedAttr = Attribute.of("rfgDeobfuscatorTransformed", Boolean)

["runtimeElements", "downgraded"].forEach { name ->
    configurations.getByName(name).attributes {
        attribute(obfAttr, "mcp")
        attribute(transformedAttr, true)
    }
}