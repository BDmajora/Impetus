org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.parallel=true
# Ubuntu's openjdk-NN-source packages leave /usr/lib/jvm/openjdk-NN holding only src.zip, which the Linux JDK scan reports as broken.
# The JVM running Gradle, JAVA_HOME and foojay-provisioned JDKs are still found with the OS scans off
org.gradle.java.installations.auto-detect=false
# The only deprecations left are inside Unimined 1.4.43-kappa, the newest published (Project.getProperties, multi-string
# notation for remapped mod sources, Task.project in remapShadowJar), so they are not reported; --warning-mode all shows them
org.gradle.warning.mode=none
org.gradle.problems.report=false

mod_version=1.0.0
mod_id=impetus
