# Configuration file

animation {
    # Master switch for all texture animations [default: true]
    B:animation=true

    # Animate other block textures [default: true]
    B:blockAnimations=true

    # Animate explosion textures [default: true]
    B:explosion=true

    # Animate fire textures [default: true]
    B:fire=true

    # Animate flame textures [default: true]
    B:flame=true

    # Animate lava textures [default: true]
    B:lava=true

    # Animate nether portal textures [default: true]
    B:portal=true

    # Animate redstone textures [default: true]
    B:redstone=true

    # Animate sculk-sensor-style textures (modded only on 1.12.2) [default: true]
    B:sculkSensor=true

    # Animate smoke textures [default: true]
    B:smoke=true

    # Animate water textures [default: true]
    B:water=true
}


baked_block_entities {
    # Bake beds [default: true]
    B:beds=true

    # Bake chests and trapped chests, single and double [default: true]
    B:chests=true

    # Master switch: draw resting chests, ender chests, signs, beds and shulker boxes as terrain instead of through their block entity renderers [default: true]
    B:enabled=true

    # Bake ender chests [default: true]
    B:enderChests=true

    # Bake closed shulker boxes [default: true]
    B:shulkerBoxes=true

    # Bake sign boards and posts (text still comes from the renderer) [default: true]
    B:signs=true
}


client_tick {
    # Skip rebuilding and uploading the lightmap while nothing but the torch flicker has changed [default: true]
    B:lightmapCaching=true
}


detail {
    # Biome-specific grass, foliage and water tint [default: true]
    B:biomeColors=true

    # Show the item name popup when switching hotbar slots [default: true]
    B:heldItemTooltips=true

    # Render the moon [default: true]
    B:moon=true

    # Render falling rain and snow [default: true]
    B:rainSnow=true

    # Render player capes [default: true]
    B:showCapes=true

    # Render the sky box [default: true]
    B:sky=true

    # Biome-specific sky colour [default: true]
    B:skyColors=true

    # Render stars [default: true]
    B:stars=true

    # Render the sun [default: true]
    B:sun=true

    # Swamp's darkened grass and foliage tint [default: true]
    B:swampColors=true

    # Number of stars to generate [range: 500 ~ 32000, default: 1500]
    I:totalStars=1500

    # Void fog near the world bottom [default: true]
    B:voidFog=true
}


entity_models {
    # Position each model box with one matrix multiply instead of up to six translate/rotate calls [default: true]
    B:matrixTransforms=true
}


extra {
    # Singleplayer autosave interval in ticks (900 = vanilla) [range: 0 ~ 36000, default: 900]
    I:autosaveInterval=900

    # Show coordinates even when the server sets the reducedDebugInfo game rule [default: false]
    B:ignoreReducedDebugInfo=false

    # Append the source mod's name to item tooltips [default: false]
    B:modNameTooltip=false

    # Overlay corner (0 = Top Left, 1 = Top Right, 2 = Bottom Left, 3 = Bottom Right) [range: 0 ~ 3, default: 0]
    I:overlayCorner=0

    # Apply a Panini projection post-effect to widen the view [default: false]
    B:paniniProjection=false

    # Panini projection strength as a percentage [range: 0 ~ 100, default: 25]
    I:paniniProjectionStrength=25

    # Show the coordinates overlay [default: false]
    B:showCoords=false

    # Include average, 1% low and 0.1% low in the FPS overlay [default: true]
    B:showFPSExtended=true

    # Show the FPS overlay [default: false]
    B:showFps=false

    # Throttle how often the F3 overlay text is rebuilt [default: true]
    B:steadyDebugHud=true

    # F3 overlay rebuild interval in ticks [range: 1 ~ 20, default: 1]
    I:steadyDebugHudRefreshInterval=1

    # Overlay text contrast (0 = None, 1 = Background, 2 = Shadow) [range: 0 ~ 2, default: 2]
    I:textContrast=2

    # Client-side time of day (0 = Default, 1 = Day only, 2 = Night only). Creative/cheats only. [range: 0 ~ 2, default: 0]
    I:timeOverride=0

    # Advancement toasts [default: true]
    B:toastAdvancement=true

    # Recipe unlock toasts [default: true]
    B:toastRecipe=true

    # System toasts [default: true]
    B:toastSystem=true

    # Tutorial toasts [default: true]
    B:toastTutorial=true

    # Master switch for toast pop-ups [default: true]
    B:toasts=true

    # Use adaptive VSync (swap interval -1) when supported [default: false]
    B:useAdaptiveSync=false

    # Client-side weather (0 = Default, 1 = Clear, 2 = Rain, 3 = Thunder). Creative/cheats only. [range: 0 ~ 3, default: 0]
    I:weatherOverride=0
}


gpu_booster {
    # Master switch for the GPU Booster set: fast random, fast math, streamed vertex uploads and the vertex format cache [default: false]
    B:enabled=false

    # Cheaper angle wrapping and log2 in MathHelper [default: true]
    B:fastMath=true

    # Give entities and particles a cheaper random generator than java.util.Random [default: true]
    B:fastRandom=true

    # Draw immediate-mode geometry through a streamed vertex buffer instead of client-side arrays [default: true]
    B:streamUploads=true

    # Keep one vertex array object per vertex format for streamed draws, so each draw binds it instead of re-specifying every attribute [default: true]
    B:vertexFormatCache=true
}


hud {
    # Draw the HUD into a framebuffer at a capped rate and composite it every frame; crosshair and vignette stay live [default: false]
    B:cacheEnabled=false

    # How many times per second the cached HUD is redrawn [range: 10 ~ 120, default: 30]
    I:cacheFps=30
}


leaves {
    # Depth mode: how many solid blocks must lie behind a leaf face before it is dropped [range: 1 ~ 4, default: 2]
    I:cullingDepth=2

    # Fancy leaf face culling (0 = Default, 1 = Check surrounding, 2 = Depth) [range: 0 ~ 2, default: 0]
    I:cullingMode=0
}


loading {
    # Encode and write screenshots on a background thread [default: true]
    B:asyncScreenshots=true

    # Ask the driver for its maximum texture size instead of probing proxy uploads from 16384 down [default: true]
    B:driverAtlasLimit=true

    # Free the screenshot readback buffers after each screenshot instead of keeping them forever [default: true]
    B:releaseScreenshotBuffers=true

    # Skip the forced full garbage collection on world load and unload [default: true]
    B:skipWorldLoadGc=true

    # Skip the 'Loading terrain' screen on dimension change and respawn [default: true]
    B:smoothDimensionChange=true
}


network {
    # Table-driven varint sizing and single-write varint encoding [default: true]
    B:fastVarInts=true

    # Queue packets sent during a server tick and flush each connection once at the end of the tick instead of per packet [default: true]
    B:flushConsolidation=true

    # Seconds a client may take to answer a keep-alive (vanilla 15) [range: 5 ~ 600, default: 120]
    I:keepAliveTimeoutSeconds=120

    # Lift vanilla's packet, payload, NBT, string and chunk data size caps (2 MB frames, 32 KB strings, 1 MB payloads) [default: true]
    B:largePackets=true

    # Seconds a client may take to finish logging in (vanilla 30) [range: 5 ~ 600, default: 120]
    I:loginTimeoutSeconds=120

    # Compress and decompress packets without copying them into fresh arrays [default: true]
    B:pooledCompression=true

    # Seconds a connection may go silent before it is dropped (vanilla 30) [range: 5 ~ 600, default: 120]
    I:readTimeoutSeconds=120
}


occlusion_culling {
    # Cull hidden block entities (chests, signs, ...) [default: true]
    B:blockEntities=true

    # Master switch: skip drawing entities and block entities a worker thread has ray-cast as hidden behind blocks [default: true]
    B:enabled=true

    # Cull hidden entities [default: true]
    B:entities=true

    # Block entities whose render box exceeds this many blocks on any axis are never culled [range: 1 ~ 32, default: 4]
    I:maxBlockEntitySize=4

    # Entities wider or taller than this many blocks are never culled [range: 1 ~ 32, default: 4]
    I:maxEntitySize=4

    # Hundredths of a block at the end of each ray that never occlude, so a target inside a block is not hidden by that block [range: 0 ~ 300, default: 100]
    I:raycastSlack=100
}


parallel_ticking {
    # Master switch for parallel server ticking (entities, random ticks, mob spawning across the worker pool); takes effect on the next launch [default: true]
    B:enabled=true

    # Tick vanilla entities in parallel across the worker pool [default: true]
    B:entities=true

    # Also tick modded entities in parallel; off keeps them on the main thread [default: false]
    B:moddedEntities=false

    # Run block random ticks (crop growth, fire spread, ...) in parallel [default: true]
    B:randomTicks=true

    # Evaluate natural mob spawn attempts in parallel per chunk [default: true]
    B:spawning=true

    # Entity ids (or namespace:*) that always tick on the main thread [default: [minecraft:tnt], [minecraft:item], [minecraft:xp_orb], [minecraft:hopper_minecart]]
    S:synchronizedEntities <
        minecraft:tnt
        minecraft:item
        minecraft:xp_orb
        minecraft:hopper_minecart
     >

    # Worker threads for parallel ticking (0 = automatic, about three quarters of the cores) [range: 0 ~ 64, default: 0]
    I:threads=0
}


particle {
    # Block break particles [default: true]
    B:blockBreak=true

    # Block breaking (mining) particles [default: true]
    B:blockBreaking=true

    # Remember that a particle's block cell has nothing to collide with instead of sweeping it every tick [default: true]
    B:collisionCache=true

    # Skip building quads for vanilla particles outside the view frustum [default: true]
    B:cullOffscreen=true

    # Dripping water and lava particles [default: true]
    B:drippingWaterLava=true

    # Firework spark particles [default: true]
    B:fireworkParticles=true

    # Sample each particle's light once per tick instead of once per frame [default: true]
    B:lightCache=true

    # Also tick modded particle classes on the pool; off keeps them on the client thread [default: false]
    B:parallelModded=false

    # Tick particles across a worker pool instead of the client thread [default: true]
    B:parallelTick=true

    # Master switch for all particles [default: true]
    B:particles=true

    # Nether portal particles [default: true]
    B:portalParticles=true

    # Potion effect particles [default: true]
    B:potionParticles=true

    # Rain splash particles [default: true]
    B:rainSplash=true

    # Void particles near the world bottom [default: true]
    B:voidParticles=true

    # Water drip, splash and suspended particles [default: true]
    B:waterParticles=true
}


particle_classes {
    # Particle classes the user has switched off [default: ]
    S:disabledClasses <
     >

    # Cache of discovered particle classes; rebuilt automatically [default: ]
    S:discoveredClasses <
     >
}


render {
    # Render armor stands [default: true]
    B:armorStands=true

    # Render beacon beams [default: true]
    B:beacons=true

    # Cloud scale in quarter steps (1 = 0.25x, 4 = vanilla, 16 = 4.00x) [range: 1 ~ 16, default: 4]
    I:cloudScale=4

    # Cloud translucency mode (0 = Default, 1 = Always, 2 = Never) [range: 0 ~ 2, default: 0]
    I:cloudTranslucency=0

    # Stack up to five models per dropped item pile instead of always drawing one [default: true]
    B:droppedItemsFancy=true

    # Render the enchanting table's floating book [default: true]
    B:enchantingTableBooks=true

    # Render atmospheric fog [default: true]
    B:fog=true

    # Fog distance in chunks (0 = follow render distance) [range: 0 ~ 32, default: 0]
    I:fogDistance=0

    # Terrain fog shape (0 = Vanilla, 1 = Cylindrical, 2 = Radial, 3 = Planar) [range: 0 ~ 3, default: 0]
    I:fogShape=0

    # Fog start distance as a percentage of the fog end (100 = vanilla) [range: 0 ~ 200, default: 100]
    I:fogStart=100

    # Distance in blocks past which framed items lose their side faces (0 = off) [range: 0 ~ 256, default: 0]
    I:itemFrameLodDistance=0

    # Render item frame name tags [default: true]
    B:itemFrameNameTag=true

    # Render item frames [default: true]
    B:itemFrames=true

    # Process client-side light updates [default: true]
    B:lightUpdates=true

    # Stop beacon beams at the world ceiling [default: false]
    B:limitBeaconBeamHeight=false

    # Render paintings [default: true]
    B:paintings=true

    # Render moving pistons [default: true]
    B:pistons=true

    # Render player name tags [default: true]
    B:playerNameTag=true

    # Block the vanilla post-processing shader pipeline [default: false]
    B:preventShaders=false

    # Break entity and block-entity rendering out by type in the F3 profiler graph [default: false]
    B:profileEntityRendering=false
}


render_budget {
    # Tighten the budget a further step when frames run 20% or more over the profile target [default: true]
    B:adaptive=true

    # Skip vanilla decorative block entity renderers (chests, signs, heads, banners, beds, shulker boxes) past the block entity distance under pressure [default: true]
    B:blockEntities=true

    # Distance in blocks past which decorative block entities and item frames may be skipped under pressure (vanilla stops most at 64 anyway) [range: 32 ~ 128, default: 48]
    I:blockEntityDistance=48

    # Adaptive render budgeting: skip distant idle mobs and thin cosmetic particles under frame pressure [default: false]
    B:enabled=false

    # Distance in blocks past which idle living entities may be skipped under pressure [range: 16 ~ 256, default: 96]
    I:entityCullDistance=96

    # Skip plain item frames past the block entity distance under pressure; glowing, named and map frames are kept [default: true]
    B:itemFrames=true

    # Show the budget, frame pressure and skipped counts on the HUD [default: false]
    B:overlay=false

    # Percentage of cosmetic particles allowed to spawn (100 = no particle budgeting) [range: 0 ~ 100, default: 65]
    I:particleBudget=65

    # Render budget profile (0 = Quality, 1 = Balanced, 2 = Performance) [range: 0 ~ 2, default: 1]
    I:profile=1

    # Skip rendering distant non-player living entities under pressure [default: true]
    B:smartEntityCulling=true
}


text {
    # Draw each string's glyphs in one batch instead of one immediate-mode quad per glyph [default: true]
    B:batchGlyphs=true
}


thread_scheduling {
    # Java priority of the chunk builder threads, 1-10 (3 = unchanged) [range: 1 ~ 10, default: 3]
    I:chunkBuilderPriority=3

    # Skip the Thread.yield() the render loop makes once per frame [default: false]
    B:removeRenderYield=false

    # Java priority of the client (render) thread, 1-10 (5 = unchanged) [range: 1 ~ 10, default: 5]
    I:renderThreadPriority=5

    # Java priority of the integrated server thread, 1-10 (5 = unchanged) [range: 1 ~ 10, default: 5]
    I:serverThreadPriority=5
}


zoom {
    # Zoom while the zoom key (C by default) is held [default: true]
    B:enabled=true

    # Hide the first-person hand and held items while zoomed [default: true]
    B:hideHand=true

    # Percentage of the normal view width kept while zoomed (23 = Logical Zoom's 4.35x) [range: 5 ~ 90, default: 23]
    I:level=23

    # Turn the cinematic camera on while zoomed [default: true]
    B:smoothCamera=true
}


